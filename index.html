<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Metals Flask Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: header + sticky folder tabs over one centered column; the game stage is a dark window onto a pixel lab bench */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --sunk:#e5ece8; --ink:#16201d; --muted:#56655f; --line:#cfdad5;
  --gold:#8a5f00; --gold-soft:#f8edd0; --teal:#1b665f; --teal-soft:#d5ebe7;
  --bad:#b3261e; --bad-soft:#fbe4e1; --ok:#22693a; --ok-soft:#ddf0e2;
  --stage:#1b2523; --cta:#f1c544; --cta-ink:#1a1405;
  --f-display:"Pixelify Sans", ui-monospace, monospace;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18201d; --sunk:#1f2925; --ink:#e2ebe7; --muted:#97a7a1; --line:#2c3833;
  --gold:#e8bf55; --gold-soft:#33290f; --teal:#73cbc1; --teal-soft:#13302c;
  --bad:#ff8f86; --bad-soft:#3a1714; --ok:#86d898; --ok-soft:#15301c;
  --stage:#0a0f0e; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --sunk:#1f2925; --ink:#e2ebe7; --muted:#97a7a1; --line:#2c3833;
  --gold:#e8bf55; --gold-soft:#33290f; --teal:#73cbc1; --teal-soft:#13302c;
  --bad:#ff8f86; --bad-soft:#3a1714; --ok:#86d898; --ok-soft:#15301c;
  --stage:#0a0f0e; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin-inline:auto}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;padding-block:24px 14px}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,5.4vw,44px);line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--gold)}
.sub{margin:8px 0 0;color:var(--muted);font-size:14px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:600 16px var(--f-display);padding:7px 18px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.volbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:0 14px}
.lbl{font:700 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vol{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:600 12.5px var(--f-mono);padding:5px 10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip.mine{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.other{display:inline-flex;align-items:center;gap:5px;font:12.5px var(--f-mono);color:var(--muted)}
.other input{width:76px;font:600 12.5px var(--f-mono);padding:5px 7px;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:2px solid var(--ink)}
.tabrow{max-width:1040px;margin-inline:auto;display:flex;gap:4px;overflow-x:auto;padding-top:8px;scrollbar-width:thin}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font:700 13.5px var(--f-body);padding:7px 12px;border:1.5px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0;background:var(--sunk);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:2px;border:1.5px solid currentColor;flex:0 0 auto}

h2{font-family:var(--f-display);font-weight:600;font-size:clamp(24px,3.6vw,32px);line-height:1.08;margin:8px 0 4px;text-wrap:balance}
h3{font:700 11.5px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.code{font:600 12px var(--f-mono);letter-spacing:.04em;color:var(--gold);background:var(--gold-soft);padding:2px 7px;border-radius:3px}
.muted{color:var(--muted)}

/* overview */
.ov-intro{display:grid;gap:16px;padding-block:24px 18px}
.ov-intro p{margin:0;max-width:68ch}
.flow{display:grid;gap:8px;padding:14px;border:1.5px dashed var(--line);border-radius:8px}
.flowrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fchip{font:700 12.5px var(--f-body);padding:4px 9px;border:1.5px solid var(--ink);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fchip.stock{border-style:dashed;cursor:default;background:transparent;color:var(--muted);border-color:var(--muted)}
.arr{color:var(--muted);font-family:var(--f-mono);font-size:13px}
.tbl{overflow-x:auto;border:1.5px solid var(--ink);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font:700 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tr.grp th{font:600 16px var(--f-display);background:var(--bg);border-bottom:1.5px solid var(--ink);padding-top:14px}
tr.grp th span{font:400 12px var(--f-mono);color:var(--muted);margin-left:10px}
tr.row:hover td{background:var(--sunk)}
td.mono{font:12.5px/1.6 var(--f-mono);font-variant-numeric:tabular-nums}
.nm{display:inline-flex;align-items:center;gap:8px;font:700 14px var(--f-body);background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left}
.nm:hover{text-decoration:underline}

/* solution header */
.solhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 28px;align-items:flex-end;padding-block:24px 8px}
.solhead > div{min-width:0}
.matrix{margin:0;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto auto;gap:3px 16px;font-size:13px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font:600 12.5px var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-block:6px 10px}
.ac{font:600 12.5px var(--f-mono);padding:3px 8px;border-radius:3px;background:var(--teal-soft);color:var(--teal)}
.opts{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-block:2px 12px}
.callout{border:1.5px dashed var(--gold);background:var(--gold-soft);padding:10px 14px;border-radius:6px;font-size:14px;margin-block:4px 10px;max-width:80ch}
.callout.warn{border-color:var(--bad);background:var(--bad-soft)}

/* game */
.stage{background:var(--stage);border-radius:10px;padding:8px;border:2px solid var(--ink)}
canvas#game{display:block;width:100%;image-rendering:pixelated;border-radius:4px;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.gmsg{min-height:2.9em;margin:10px 2px 0;font-size:14.5px;max-width:80ch}
.gmsg.ok{color:var(--ok)} .gmsg.bad{color:var(--bad)} .gmsg.info{color:var(--muted)}
.pad{display:flex;flex-wrap:wrap;gap:10px;padding-block:6px 4px;align-items:center}
.pbtn{font:600 16px var(--f-display);padding:10px 18px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:6px;box-shadow:0 3px 0 var(--ink);cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.pbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.pbtn.main{background:var(--cta);color:var(--cta-ink);border-color:var(--ink)}
.pbtn.cap{background:var(--ink);color:var(--bg)}
.padnote{color:var(--muted);font-size:14px}
kbd{font:11px var(--f-mono);padding:1px 4px;border:1px solid currentColor;border-radius:3px;opacity:.7;margin-left:6px}
details.cheat{margin-top:16px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface)}
details.cheat summary{cursor:pointer;padding:10px 14px;font-weight:700}
details.cheat .inner{padding:0 14px 14px}

/* learn */
.learn{display:grid;grid-template-columns:minmax(170px,230px) minmax(0,1fr);gap:28px;align-items:start;padding-block:6px}
.flaskfig{position:sticky;top:64px;margin:0}
.flaskfig svg{width:100%;height:auto;max-width:230px;display:block;margin-inline:auto}
.flaskfig figcaption{text-align:center;font:600 13px var(--f-mono);color:var(--muted);margin-top:6px}
#liq{transition:transform .7s cubic-bezier(.3,.7,.3,1)}
ol.steps{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:8px}
ol.steps li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
ol.steps li.done{background:var(--ok-soft);border-color:transparent}
.sn{font:600 14px var(--f-display);width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;padding:0}
li.done .sn{background:var(--ink);color:var(--bg)}
.stxt b{display:block}
.stxt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.stxt small.warn{color:var(--bad)}
.svol{font:600 15px var(--f-mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.svol small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.math{font:12.5px/1.8 var(--f-mono);margin:0;padding:0;list-style:none}
.math b{color:var(--teal)}
.labelcard{display:inline-grid;gap:3px;padding:12px 16px;background:var(--surface);border:2px solid var(--ink);border-radius:4px;font:12.5px/1.45 var(--f-mono);max-width:100%}
.labelcard .big{font:600 15px var(--f-mono)}
.labelcard input{font:600 12.5px var(--f-mono);width:56px;padding:1px 4px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
ul.notes{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.foot{margin-top:28px;font-size:12.5px;color:var(--muted);max-width:80ch}
@media (max-width:720px){.learn{grid-template-columns:1fr}.flaskfig{position:static}.flaskfig svg{max-width:150px}}
@media (prefers-reduced-motion:reduce){#liq{transition:none}}
</style>
</head>
<body>
<header class="wrap top">
  <div>
    <h1>Metals <span>Flask</span> Run</h1>
    <p class="sub">SOP 2-HMN v10.0 · every heavy-metals solution, scaled to the flask you have</p>
  </div>
  <div class="seg" role="group" aria-label="Mode">
    <button id="mPlay" type="button">Play</button><button id="mLearn" type="button">Learn</button>
  </div>
</header>
<div class="wrap volbar"><span class="lbl">Flask size</span><div id="vols" class="vol"></div></div>
<nav class="tabs" aria-label="Solutions"><div class="tabrow" id="tabs" role="tablist"></div></nav>
<main class="wrap" id="view"></main>

<script>
/* ---------- storage & state ---------- */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('mfr.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('mfr.'+k,JSON.stringify(v))}catch(e){}}};
const state={tab:'solutions',mode:store.get('mode','play'),vol:store.get('vol',200),chain:store.get('chain','ical'),
             cal:store.get('cal',4),init:store.get('init',''),num:store.get('num',{}),checks:{}};

/* ---------- formatting ---------- */
const num=(x,p=3)=>String(+(+x).toPrecision(p));
const fmtC=ppm=>!ppm?'0 ppb':ppm>=1?num(ppm)+' ppm':num(ppm*1000)+' ppb';
const fmtV=v=>v==null?'':v>=100?v.toFixed(0)+' mL':v>=10?v.toFixed(1)+' mL':v>=1?v.toFixed(2)+' mL':v.toFixed(3)+' mL';
const fmtUL=v=>{const u=v*1000;return (u<10?u.toFixed(1):Math.round(u))+' µL'};
const vShort=(v,ap)=>(ap?'~':'')+(v<1?fmtUL(v):v>=100?Math.round(v)+' mL':num(v)+' mL');
const CLASSA={10:.02,25:.03,50:.05,100:.08,200:.10,250:.12,500:.20,1000:.30};
const tolFor=V=>CLASSA[V]??Math.max(.01,+(V*.0005).toFixed(3));
const addMonths=(d,n)=>{const r=new Date(d),day=r.getDate();r.setMonth(r.getMonth()+n);if(r.getDate()<day)r.setDate(0);return r};
const fmtD=d=>`${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
const val=x=>typeof x==='function'?x():x;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- bottles on the shelf ---------- */
const ITEMS={
  di:{full:'DI water',short:'DI',liq:'#d6f0fb',cap:'#2f9fd8'},
  hno3:{full:'HNO₃, conc. (67–70%)',short:'HNO3',liq:'#f4e389',cap:'#d39e00',acid:'HNO₃'},
  hcl:{full:'HCl, conc. (34–37%)',short:'HCl',liq:'#e3f1ff',cap:'#2c62c9',acid:'HCl'},
  h2o2:{full:'H₂O₂ 30%',short:'H2O2',liq:'#e9fff2',cap:'#2e9b5a'},
  au1000:{full:'Au 1000 ppm stock',short:'Au 1000',liq:'#ffd24a',cap:'#9c6f05',conc:{Au:1000},stock:true},
  au100:{full:'Au 100 ppm intermediate (HMAu)',short:'Au 100',liq:'#ffe7a0',cap:'#c99512',conc:{Au:100}},
  ismix:{full:'Internal standard mix, 10 ppm',short:'IS mix',liq:'#e0d2ff',cap:'#6a4bcf',conc:{IS:10}},
  tunemix:{full:'Tuning mix, 10 ppm',short:'Tune mix',liq:'#ffd3ea',cap:'#c93b88',conc:{Tune:10}},
  dil:{full:'Diluent (HMDil)',short:'Diluent',liq:'#fff2bf',cap:'#b8901a'},
};
const MET=['As','Cd','Pb','Cr','Ni','Hg'];
const STOCKCOL={As:['#c9f2d5','#2e7d32'],Cd:['#ffe2bf','#e0660a'],Pb:['#d5dde1','#4f6470'],Cr:['#d9efc9','#5c8f1e'],Ni:['#c3ece7','#00897b'],Hg:['#edf1f3','#8c9ba3']};
Object.entries(STOCKCOL).forEach(([m,[l,c]])=>{ITEMS[m.toLowerCase()]={full:`${m} 1000 ppm stock`,short:`${m} 1000`,liq:l,cap:c,conc:{[m]:1000},stock:true}});
const wsConc=(c,hg)=>{const o={};MET.forEach(m=>o[m]=m==='Hg'?c*hg:c);return o};
[[1,100],[2,10],[3,1],[4,.01]].forEach(([n,c])=>{
  ITEMS[`ws${n}i`]={full:`WS${n}, ICAL chain (${fmtC(c)}; Hg ${fmtC(c/10)})`,short:`WS${n} ICAL`,liq:'#c9efe0',cap:'#1f8a70',conc:wsConc(c,.1)};
  ITEMS[`ws${n}c`]={full:`WS${n}, CCV chain (${fmtC(c)}, Hg too)`,short:`WS${n} CCV`,liq:'#ffdcb8',cap:'#d0661a',conc:wsConc(c,1)};
});
const ANAME={IS:'Each IS element',Tune:'Each tuning element'};
const ORDER=['As','Cd','Pb','Cr','Ni','Hg','Au','IS','Tune'];

/* ---------- the solutions, straight from SOP 2-HMN ---------- */
const ACIDNOTE='Water first, then acid. Concentrated acid work happens in the fume hood (4.1, 4.4).';
const ch=p=>p+(state.chain==='ical'?'i':'c');
const oth=p=>p+(state.chain==='ical'?'c':'i');
const chainName=()=>state.chain==='ical'?'ICAL':'CCV';
const wrongChain=()=>`That bottle is from the ${state.chain==='ical'?'CCV':'ICAL'} chain. You are making the ${chainName()} chain (switch it above the game).`;
const NODIL='Calibrators and CCVs are made up in diluent, not DI water, so their acid and gold match the digested samples.';
const CAL=[{n:1,ppb:0},{n:2,ppb:.2,src:'ws4i',v:1},{n:3,ppb:.5,src:'ws4i',v:2.5},{n:4,ppb:1,src:'ws3i',v:.05},{n:5,ppb:5,src:'ws3i',v:.25},{n:6,ppb:10,src:'ws3i',v:.5},{n:7,ppb:50,src:'ws3i',v:2.5}];
const curCal=()=>CAL[state.cal-1]||CAL[3];
const WSNOTE='The SOP batch is 10 mL. The analyst may change the final volume (7.4.3.3), but a bigger flask uses proportionally more stock.';

const SOLS=[
 {id:'gold',tab:'Gold 100 ppm',name:'Intermediate gold solution',code:'HMAu',matrix:'100 ppm Au in 10% HCl',base:100,exp:3,sop:'7.3.1',log:'4-HMR',liq:'#f2b705',grp:'reagent',
  steps:()=>[{k:'pre',item:'di',v:50,approx:true,note:ACIDNOTE},{k:'add',item:'hcl',v:10},{k:'add',item:'au1000',v:10},{k:'qs',item:'di'}],
  decoys:()=>[['au100','That is the 100 ppm gold you are making. Start from the 1000 ppm stock.'],['hno3','The gold intermediate is in HCl only. No nitric in this one.'],['h2o2','Peroxide is a digestion reagent. It never goes in a standard.']],
  notes:['Gold keeps mercury in solution and cuts Hg memory in the sample lines. That is why it goes into the diluent and into every digested sample (0.1 mL of this per tube, 12.7.6).','Make this before the diluent. The diluent uses it.'],
  safety:['Concentrated HCl causes severe burns and eye damage (Table 2).']},
 {id:'diluent',tab:'Diluent',name:'Diluent for calibration standards',code:'HMDil',matrix:'4% HNO₃, 0.8% HCl, 200 ppb Au',base:1000,exp:3,sop:'7.3.2',log:'4-HMR',liq:'#e3b844',grp:'reagent',
  steps:()=>[{k:'pre',item:'di',v:500,approx:true,note:ACIDNOTE},{k:'add',item:'hno3',v:40},{k:'add',item:'hcl',v:8},{k:'add',item:'au100',v:2},{k:'qs',item:'di'}],
  decoys:()=>[['au1000','Use the 100 ppm gold intermediate. The 1000 ppm stock gives ten times too much gold.'],['ismix','The internal standard is its own solution (7.4.1). It does not go in the diluent.'],['h2o2','Peroxide is a digestion reagent. It never goes in the diluent.']],
  notes:['Every calibration standard and CCV is made up in this (7.3.2.1), so they match the acid and gold in the digested samples.'],
  safety:['Concentrated HNO₃ is an oxidizer and corrosive; HCl causes severe burns (Table 2).']},
 {id:'rinse',tab:'Rinse / carrier',name:'Rinse and carrier solution',code:'HMRin',matrix:'4% HNO₃, 0.8% HCl',base:1000,exp:3,sop:'7.3.3',log:'4-HMR',liq:'#6faee0',grp:'reagent',
  steps:()=>[{k:'pre',item:'di',v:500,approx:true,note:ACIDNOTE},{k:'add',item:'hno3',v:40},{k:'add',item:'hcl',v:8},{k:'qs',item:'di'}],
  decoys:()=>[['au100','No gold in the rinse. Gold goes in the diluent.'],['h2o2','Peroxide is a digestion reagent, not a rinse.']],
  notes:['Fills the instrument’s three rinse containers and the carrier (7.3.3.1). Rinse goes fast, so the 1 L SOP batch may suit it better than a 200 mL flask.'],
  safety:['Concentrated HNO₃ and HCl in the fume hood (4.4).']},
 {id:'istd',tab:'Internal std',name:'Internal standard',code:'HMIS',matrix:'200 ppb in 4% HNO₃',base:250,exp:3,sop:'7.4.1',log:'4-HMWSP',liq:'#9b7be0',grp:'ws',
  steps:()=>[{k:'pre',item:'di',v:125,approx:true,note:ACIDNOTE},{k:'add',item:'hno3',v:10},{k:'add',item:'ismix',v:5},{k:'qs',item:'di'}],
  decoys:()=>[['tunemix','Tuning mix (Ce, Co, Li, Tl, Y) is for the auto-tune, not the internal standard.'],['hcl','The internal standard is in 4% HNO₃ only. No HCl.']],
  notes:['Elements: Bi, Ge, In, ⁶Li, Sc, Tb, Y at 200 ppb each.','Every injection must keep IS recovery within 80–120% of the calibration, or it gets re-run (11.6.3–11.6.4).'],
  safety:['Concentrated HNO₃ in the fume hood.']},
 {id:'tune',tab:'Tuning',name:'Tuning solution',code:'HMTS',matrix:'10 ppb in 2% HNO₃',base:250,exp:3,sop:'7.4.2',log:'4-HMWSP',liq:'#e36aa8',grp:'ws',
  steps:()=>[{k:'pre',item:'di',v:125,approx:true,note:ACIDNOTE},{k:'add',item:'hno3',v:5},{k:'add',item:'tunemix',v:.25},{k:'qs',item:'di'}],

const volFor=sol=>state.vol==='sop'?sol.base:state.vol;
function resolve(sol){
  const V=volFor(sol),f=V/sol.base;
  const steps=sol.steps().map(s=>({...s,v:s.v!=null?s.v*f:null,sopV:s.v}));
  const added=steps.filter(s=>s.k!=='qs').reduce((a,s)=>a+s.v,0);
  const qs=steps.find(s=>s.k==='qs');if(qs)qs.v=Math.max(0,V-added);
  const an={},acids={};
  steps.forEach(s=>{if(s.k!=='add')return;const it=ITEMS[s.item];
    if(it.conc)for(const[a,c]of Object.entries(it.conc))an[a]=(an[a]||0)+c*s.v/V;
    if(it.acid)acids[it.acid]=(acids[it.acid]||0)+s.v/V*100;});
  const warns=[],heavy=steps.filter(s=>s.k==='add'&&ITEMS[s.item].stock&&s.v>5);
  if(heavy.length)warns.push(`Heavy on stock: this flask uses ${heavy.map(s=>`${fmtV(s.v)} ${ITEMS[s.item].short}`).join(', ')} (1000 ppm). The SOP batch uses ${heavy.map(s=>fmtV(s.sopV)).filter((x,i,a)=>a.indexOf(x)===i).join(' / ')} of each.`);
  steps.forEach(s=>{if(s.k!=='add')return;const it=ITEMS[s.item];
    if(s.v<.02)warns.push(`${fmtUL(s.v)} of ${it.short} is under the 20 µL low end of the pipettes (Table 3). Pick a bigger flask.`);});
  return {V,f,steps,an,acids,warns,inDil:qs&&qs.item==='dil'};
}
function groupConc(o){const m=new Map();ORDER.filter(k=>o[k]!=null).forEach(k=>{const c=o[k];const key=c.toPrecision(6);if(!m.has(key))m.set(key,{c,names:[]});m.get(key).names.push(ANAME[k]||k)});return [...m.values()]}
function chipsFor(r){
  const out=groupConc(r.an).map(g=>`${g.names.join(' ')} ${fmtC(g.c)}`);
  Object.entries(r.acids).forEach(([a,p])=>out.push(`${a} ${num(p,2)}%`));
  if(r.inDil)out.push('in diluent');
  if(!out.length)out.push('blank');
  return out;
}
function pipPlan(s){
  if(s.k==='qs')return 'Wash bottle. Last few mL drop by drop.';
  if(s.approx)return s.v>=10?'Graduated cylinder, approximate is fine':'Pipette, approximate is fine';
  if(s.v<.02)return null;
  if(s.v>30)return 'Graduated cylinder or volumetric pipette';

  function frame(t){raf=requestAnimationFrame(frame);const dt=Math.min(50,t-(last||t));last=t;if(st){update(dt);draw(t)}}

  const tabs=[{id:'solutions',label:'All solutions'},...SOLS.map(s=>({id:s.id,label:s.tab,col:val(s.liq)}))];

function openTab(id){state.tab=id;try{history.replaceState(null,'','#'+id)}catch(e){}renderTabs();renderView();window.scrollTo({top:0})}

function renderView(){
  Game.unmount();
  const v=$('#view');
  if(state.tab==='solutions'){v.innerHTML=overviewHTML();bindOverview();return}
  const sol=SOL[state.tab],r=resolve(sol);
  v.innerHTML=headHTML(sol,r)+(state.mode==='play'?playHTML(sol,r):learnHTML(sol,r))+
    `<p class="foot">Bottle and liquid colors are for the game; the real solutions are clear. Volumes scale linearly from SOP 2-HMN v10.0; concentrations never change. Check anything new against the SOP and your QA manager before it goes in a logbook.</p>`;

}

function stepsHTML(sol,r,checkable){
  const ck=state.checks[ckKey(sol)]||new Set();
  const qsIt=ITEMS[(r.steps.find(s=>s.k==='qs')||{}).item]||ITEMS.di;
  const list=[...r.steps,{k:'mix'},{k:'label'}];
  return `<ol class="steps">${list.map((s,i)=>{
    const it=ITEMS[s.item];let title='',sub='',vol='';
    if(s.k==='pre'){title=`Add about ${fmtV(s.v)} of ${it.full}`;sub=s.note||'';vol=`~${fmtV(s.v)}`}
    else if(s.k==='add'){title=`Pipette ${it.full}`;const p=pipPlan(s);sub=(p?p:`<span class="warn">Too small to pipette at this flask size.</span>`)+(s.grp?' · any order within the stocks':'');vol=fmtV(s.v)+(s.v<1?`<small>${fmtUL(s.v)}</small>`:'')}
    else if(s.k==='qs'){title=`Q.S. to the line with ${it.full}`;sub=`Bottom of the meniscus on the line at eye level. ${pipPlan(s)}`;vol=`≈${fmtV(s.v)}`}
    else if(s.k==='mix'){title='Stopper and invert to mix';sub='Ten or so inversions, until there are no streaks.'}
    else {title='Label and log it';sub=`Name, prep date, expiration date, initials. Record it on form ${sol.log}.`}
    const done=ck.has(i);
    return `<li class="${done?'done':''}">${checkable?`<button type="button" class="sn" data-i="${i}" aria-pressed="${done}" aria-label="Mark step ${i+1} done">${i+1}</button>`:`<span class="sn">${i+1}</span>`}
      <div class="stxt"><b>${esc(title)}</b>${sub?`<small>${sub}</small>`:''}</div><div class="svol">${vol}</div></li>`}).join('')}</ol>`;
}
function playHTML(sol,r){
  return `<div class="stage"><canvas id="game" tabindex="0" aria-label="Flask run game: catch the ingredients for ${esc(val(sol.name))} in order"></canvas></div>
  <div class="gmsg info" id="gmsg" aria-live="polite">Press Space or tap the bench to start.</div>
  <div class="pad" id="pad"></div>
  <details class="cheat"><summary>Show the recipe card</summary><div class="inner">${stepsHTML(sol,r,false)}</div></details>`;
}
const ckKey=sol=>sol.id+(sol.id==='cal'?curCal().n:'')+(sol.chain?state.chain:'')+'@'+volFor(sol);
function fillFrac(sol,r){const ck=state.checks[ckKey(sol)]||new Set();let v=0,full=false;r.steps.forEach((s,i)=>{if(!ck.has(i))return;if(s.k==='qs')full=true;else v+=s.v});return full?1:Math.min(.97,v/r.V)}
function levelY(f){return f>=.97?151-(f-.97)/.03*91:310-(f/.97)*159}
function flaskSVG(sol,r){
  const f=fillFrac(sol,r);
  return `<figure class="flaskfig"><svg viewBox="0 0 200 330" role="img" aria-label="Volumetric flask, ${Math.round(f*100)}% filled">
    <defs><clipPath id="fc"><path d="M90 16 L90 151 A80 80 0 1 0 110 151 L110 16 Z"/></clipPath></defs>
    <path d="M90 16 L90 151 A80 80 0 1 0 110 151 L110 16 Z" fill="var(--surface)"/>
    <g clip-path="url(#fc)"><rect id="liq" x="0" y="0" width="200" height="340" fill="${val(sol.liq)}" opacity=".75" style="transform:translateY(${levelY(f)}px)"/></g>
    <path d="M90 16 L90 151 A80 80 0 1 0 110 151 L110 16 Z" fill="none" stroke="var(--ink)" stroke-width="3"/>
    <line x1="84" y1="60" x2="116" y2="60" stroke="var(--ink)" stroke-width="2.5"/>
    <rect x="86" y="2" width="28" height="16" rx="3" fill="var(--ink)"/>
    <text x="100" y="236" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" fill="var(--ink)">${r.V} mL</text>
    <text x="100" y="254" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--ink)">±${tolFor(r.V).toFixed(2)} · TC 20 °C · A</text>
  </svg><figcaption id="fcap">${f>=1?'at the line':Math.round(f*100)+'% of the way'}</figcaption></figure>`;
}
function learnHTML(sol,r){
  const math=[];
  r.steps.forEach(s=>{if(s.k!=='add')return;const it=ITEMS[s.item];
    if(it.conc)groupConc(it.conc).forEach(g=>math.push(`${g.names.join('/')} ${fmtC(g.c)} × ${fmtV(s.v)} ÷ ${fmtV(r.V)} = <b>${fmtC(g.c*s.v/r.V)}</b>`));
    if(it.acid)math.push(`${it.acid} ${fmtV(s.v)} ÷ ${fmtV(r.V)} = <b>${num(s.v/r.V*100,2)}%</b> v/v conc. acid`);});
  if(r.inDil)math.push('Made up in diluent, so it also carries <b>4% HNO₃, 0.8% HCl, 200 ppb Au</b>.');
  if(!math.length)math.push('Nothing added. It is diluent at the line.');
  const now=new Date(),ex=sol.exp?fmtD(addMonths(now,sol.exp)):'set by QA';
  return `<div class="learn">${flaskSVG(sol,r)}<div>
    <h3>Steps · tap a number to check it off</h3>${stepsHTML(sol,r,true)}
    <div class="lgrid">
      <section><h3>The math, C₁V₁ = C₂V₂</h3><ul class="math">${math.map(m=>`<li>${m}</li>`).join('')}</ul></section>
      <section><h3>Label</h3><div class="labelcard">
        <span class="big">${esc(val(sol.code))}${sol.id==='cal'?'':`-<input id="lblNum" type="text" maxlength="5" value="${esc(state.num[sol.id]||'')}" placeholder="#" aria-label="Preparation number">`}</span>
        <span>${esc(val(sol.name))}</span><span>${esc(val(sol.matrix))}</span>
        <span>Prep ${fmtD(now)} · Exp ${ex}</span>
        <span>Initials <input id="lblInit" type="text" maxlength="4" value="${esc(state.init)}" placeholder="__" aria-label="Your initials"></span>
      </div></section>
      <section><h3>Why it matters</h3><ul class="notes">${sol.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></section>
      <section><h3>Safety</h3><ul class="notes">${(sol.safety||[]).map(n=>`<li>${esc(n)}</li>`).join('')}<li>Lab coat, safety glasses and nitrile gloves (4.1).</li></ul></section>
    </div></div></div>`;
}
function say(t,kind){const m=$('#gmsg');if(m){m.textContent=t;m.className='gmsg '+(kind||'info')}}
function pad(p){
  const el=$('#pad');if(!el)return;
  const B=(id,label,cls='')=>`<button class="pbtn ${cls}" id="${id}" type="button">${label}</button>`;
  let h='';
  if(p==='title')h=B('pStart','Start run<kbd>Space</kbd>','main');
  else if(p==='run')h=B('pJump','Jump<kbd>Space</kbd>','main');
  else if(p==='toqs')h='<span class="padnote">All ingredients in. Heading to the Q.S.…</span>';
  else if(p==='qs')h=B('pPour','Hold to pour','main')+B('pDrop','One drop<kbd>D</kbd>')+B('pCap','Cap it<kbd>Enter</kbd>','cap');
  else if(p==='mix')h=B('pInv','Invert<kbd>Space</kbd>','main');
  else if(p==='label')h=B('pFin','Stick the label<kbd>Space</kbd>','main');
  else h=B('pAgain','Run again','main')+B('pLearn','Learn this one');
  el.innerHTML=h;
  const cvs=$('#game'),refocus=()=>cvs&&cvs.focus({preventScroll:true});
  const on=(id,fn)=>{const b=$('#'+id);if(b)b.onclick=()=>{fn();refocus()}};
  on('pStart',Game.press);on('pJump',Game.press);on('pInv',Game.press);on('pFin',Game.press);on('pAgain',Game.restart);on('pDrop',Game.drop);on('pCap',Game.cap);
  const l=$('#pLearn');if(l)l.onclick=()=>$('#mLearn').click();
  const pp=$('#pPour');if(pp){pp.onpointerdown=e=>{e.preventDefault();pp.setPointerCapture?.(e.pointerId);Game.pour(true)};
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>pp.addEventListener(ev,()=>Game.pour(false)));pp.oncontextmenu=e=>e.preventDefault()}
}
function bindSol(sol,r){
  const v=$('#view');
  v.querySelectorAll('[data-chain]').forEach(b=>b.onclick=()=>{state.chain=b.dataset.chain;store.set('chain',state.chain);renderTabs();renderView()});
  v.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{state.cal=+b.dataset.cal;store.set('cal',state.cal);renderView()});
  v.querySelectorAll('.sn[data-i]').forEach(b=>b.onclick=()=>{
    const k=ckKey(sol),set=state.checks[k]||(state.checks[k]=new Set()),i=+b.dataset.i;
    set.has(i)?set.delete(i):set.add(i);const li=b.closest('li');li.classList.toggle('done',set.has(i));b.setAttribute('aria-pressed',set.has(i));
    const f=fillFrac(sol,r),liq=$('#liq');if(liq)liq.style.transform=`translateY(${levelY(f)}px)`;const fc=$('#fcap');if(fc)fc.textContent=f>=1?'at the line':Math.round(f*100)+'% of the way'});
  const ln=$('#lblNum');if(ln)ln.oninput=e=>{state.num[sol.id]=e.target.value;store.set('num',state.num)};
  const li=$('#lblInit');if(li)li.oninput=e=>{state.init=e.target.value.toUpperCase();store.set('init',state.init)};
  const cvs=$('#game');
  if(cvs){
    Game.mount(cvs,sol,r,{say,phase:pad});
    cvs.addEventListener('pointerdown',e=>{e.preventDefault();cvs.focus({preventScroll:true});cvs.setPointerCapture?.(e.pointerId);Game.press()});
    cvs.addEventListener('pointerup',()=>Game.release());cvs.addEventListener('pointercancel',()=>Game.release());
    cvs.oncontextmenu=e=>e.preventDefault();
  }
}
window.addEventListener('keydown',e=>{
  if(!Game.active())return;const t=e.target;
  if(t&&t.closest&&t.closest('input,textarea,select,button,summary,a'))return;
  const r=$('#game').getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)Game.press()}
  else if(e.code==='Enter'){if(Game.phase()==='qs'){e.preventDefault();Game.cap()}}
  else if(e.code==='KeyD'){Game.drop()}
});
window.addEventListener('keyup',e=>{if(Game.active()&&(e.code==='Space'||e.code==='ArrowUp'))Game.release()});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>Game.resize(),120)});

/* ---------- boot ---------- */
(function(){
  const h=(location.hash||'').slice(1);if(h&&(h==='solutions'||SOL[h]))state.tab=h;
  renderMode();renderVols();renderTabs();renderView();
  if(document.fonts&&document.fonts.load)document.fonts.load('600 16px "Pixelify Sans"').catch(()=>{});
})();
</script>
</body>
</html>
